<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombena ThermoCalc Pro</title>
    
    <!-- Configuration PWA pour l'icône sur l'écran d'accueil -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Ombena ThermoCalc Pro%22,
        %22short_name%22: %22ThermoCalc%22,
        %22start_url%22: %22./%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%230f172a%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: [
            {
                %22src%22: %22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%232563eb'/%3E%3Ctext x='50%25' y='55%25' font-size='45' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'%3EOT%3C/text%3E%3C/svg%3E%22,
                %22sizes%22: %22192x192 512x512%22,
                %22type%22: %22image/svg+xml%22
            }
        ]
    }">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><text x=%2250%%22 y=%2255%%22 font-size=%2245%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>OT</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><text x=%2250%%22 y=%2255%%22 font-size=%2245%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>OT</text></svg>">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #1e293b;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo-placeholder {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-weight: bold;
            font-size: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 3px;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #64748b;
        }
        .step-indicator span.active {
            color: #2563eb;
        }
        .step-content {
            display: none;
        }
        .step-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .result-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e2e8f0;
            border-left: 5px solid #2563eb;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .result-title {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 6px;
        }
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .result-label {
            color: #64748b;
            font-weight: 500;
        }
        .result-value {
            color: #0f172a;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <div class="logo-placeholder">OT</div>
        </div>

        <h2>Ombena ThermoCalc</h2>
        <div class="subtitle">Performance Énergétique &bull; Hors-Ligne</div>

        <div class="step-indicator">
            <span id="ind-1" class="active">1. PROJET</span>
            <span id="ind-2">2. PARAMÈTRE</span>
            <span id="ind-3">3. RÉSULTATS</span>
        </div>

        <!-- ÉTAPE 1 : PROJET -->
        <div id="step-1" class="step-content active">
            <div class="form-group">
                <label for="nomProjet">Nom du Projet / Bâtiment</label>
                <input type="text" id="nomProjet" placeholder="Ex: Résidence Owendo">
            </div>
            <div class="form-group">
                <label for="nomClient">Nom du Maître d'Ouvrage</label>
                <input type="text" id="nomClient" placeholder="Ex: Ombena">
            </div>
            <button onclick="changerEtape(2)">Continuer</button>
        </div>

        <!-- ÉTAPE 2 : PARAMÈTRES THERMIQUES -->
        <div id="step-2" class="step-content">
            <div class="form-group">
                <label for="surface">Surface des parois (m²)</label>
                <input type="number" id="surface" placeholder="Ex: 120">
            </div>
            <div class="form-group">
                <label for="deltaT">Écart de température (°C)</label>
                <input type="number" id="deltaT" placeholder="Ex: 20">
            </div>
            <div class="form-group">
                <label for="resistance">Résistance thermique R (m²·K/W)</label>
                <input type="number" step="0.01" id="resistance" placeholder="Ex: 2.5">
            </div>
            <div class="btn-container">
                <button class="btn-secondary" onclick="changerEtape(1)">Retour</button>
                <button onclick="lancerCalcul()">Calculer</button>
            </div>
        </div>

        <!-- ÉTAPE 3 : RÉSULTATS -->
        <div id="step-3" class="step-content">
            <div class="result-card">
                <div class="result-title">📊 Synthèse Analytique</div>
                <div class="result-item">
                    <span class="result-label">Projet :</span>
                    <span class="result-value" id="resProjet">--</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Client :</span>
                    <span class="result-value" id="resClient">--</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Coefficient U :</span>
                    <span class="result-value"><span id="resU">--</span> W/(m²·K)</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Flux thermique :</span>
                    <span class="result-value"><span id="resFlux">--</span> W</span>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn-secondary" onclick="changerEtape(2)">Modifier</button>
                <button style="background-color: #ef4444;" onclick="effacerDonnees()">Nouvelle étude</button>
            </div>
        </div>
    </div>

    <script>
        function changerEtape(numero) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step-indicator span').forEach(el => el.classList.remove('active'));
            
            const targetStep = document.getElementById('step-' + numero);
            const targetInd = document.getElementById('ind-' + numero);

            if (targetStep) targetStep.classList.add('active');
            if (targetInd) targetInd.classList.add('active');
        }

        function lancerCalcul() {
            const nomProjet = document.getElementById("nomProjet").value || "Projet Sans Nom";
            const nomClient = document.getElementById("nomClient").value || "Client Inconnu";
            const surface = parseFloat(document.getElementById("surface").value) || 0;
            const deltaT = parseFloat(document.getElementById("deltaT").value) || 0;
            const resistance = parseFloat(document.getElementById("resistance").value) || 1;

            const flux = (surface * deltaT) / resistance;
            const u = 1 / resistance;

            document.getElementById("resProjet").innerText = nomProjet;
            document.getElementById("resClient").innerText = nomClient;
            document.getElementById("resU").innerText = u.toFixed(2);
            document.getElementById("resFlux").innerText = flux.toFixed(2);

            changerEtape(3);
        }

        function effacerDonnees() {
            document.getElementById("nomProjet").value = "";
            document.getElementById("nomClient").value = "";
            document.getElementById("surface").value = "";
            document.getElementById("deltaT").value = "";
            document.getElementById("resistance").value = "";
            changerEtape(1);
        }
    </script>
</body>
</html>
