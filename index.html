<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombena ThermoCalc Pro</title>
    <!-- Inclusion de jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #1e293b;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ombena ThermoCalc</h2>
        <div class="subtitle">Performance Énergétique</div>

        <div class="form-group">
            <label for="nomProjet">Nom du Projet / Bâtiment</label>
            <input type="text" id="nomProjet" placeholder="Ex: Résidence Lumumba">
        </div>

        <div class="form-group">
            <label for="nomClient">Nom du Maître d'Ouvrage</label>
            <input type="text" id="nomClient" placeholder="Ex: M. Ombena">
        </div>

        <button onclick="telechargerPDFSpectaculaire()">Télécharger le Rapport PDF</button>
    </div>

    <script>
        function telechargerPDFSpectaculaire() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // En-tête du PDF
            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 36, "F");

            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("OMBENA THERMOCALC PRO", 15, 23);

            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("Rapport d'Étude Thermique & Efficacité", 15, 30);

            // Contenu dynamique
            doc.setTextColor(30, 41, 59);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.text("1. Informations Générales du Projet", 15, 50);
            doc.line(15, 54, 195, 54);

            const projet = document.getElementById("nomProjet").value || "Non renseigné";
            const client = document.getElementById("nomClient").value || "Non renseigné";

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.text("Nom du Projet : " + projet, 15, 66);
            doc.text("Maître d'Ouvrage : " + client, 15, 74);

            // Génération propre en Blob pour éviter les conflits mobiles/Termux
            const blobPdf = doc.output('blob');
            const urlBlob = URL.createObjectURL(blobPdf);
            
            const lien = document.createElement('a');
            lien.href = urlBlob;
            lien.download = 'Rapport_Thermique.pdf';
            lien.style.display = 'none';
            document.body.appendChild(lien);
            
            lien.click();
            
            setTimeout(() => {
                document.body.removeChild(lien);
                window.URL.revokeObjectURL(urlBlob);
            }, 100);
        }
    </script>
</body>
</html>
