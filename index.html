<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombena ThermoCalc Pro</title>
    <!-- Inclusion de jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #1e293b;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #64748b;
        }
        .step-indicator span.active {
            color: #2563eb;
        }
        .step-content {
            display: none;
        }
        .step-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ombena ThermoCalc</h2>
        <div class="subtitle">Performance Énergétique</div>

        <div class="step-indicator">
            <span id="ind-1" class="active">1. PROJET</span>
            <span id="ind-2">2. PARAMÈTRE</span>
            <span id="ind-3">3. RÉSULTATS</span>
        </div>

        <!-- ÉTAPE 1 : PROJET -->
        <div id="step-1" class="step-content active">
            <div class="form-group">
                <label for="nomProjet">Nom du Projet / Bâtiment</label>
                <input type="text" id="nomProjet" placeholder="Ex: Résidence Lumumba">
            </div>
            <div class="form-group">
                <label for="nomClient">Nom du Maître d'Ouvrage</label>
                <input type="text" id="nomClient" placeholder="Ex: M. Ombena">
            </div>
            <button onclick="changerEtape(2)">Continuer</button>
        </div>

        <!-- ÉTAPE 2 : PARAMÈTRES THERMIQUES -->
        <div id="step-2" class="step-content">
            <div class="form-group">
                <label for="surface">Surface des parois (m²)</label>
                <input type="number" id="surface" placeholder="Ex: 120">
            </div>
            <div class="form-group">
                <label for="deltaT">Écart de température (°C)</label>
                <input type="number" id="deltaT" placeholder="Ex: 20">
            </div>
            <div class="form-group">
                <label for="resistance">Résistance thermique R (m²·K/W)</label>
                <input type="number" step="0.01" id="resistance" placeholder="Ex: 2.5">
            </div>
            <div class="btn-container">
                <button class="btn-secondary" onclick="changerEtape(1)">Retour</button>
                <button onclick="lancerCalcul()">Calculer</button>
            </div>
        </div>

        <!-- ÉTAPE 3 : RÉSULTATS & PDF -->
        <div id="step-3" class="step-content">
            <div class="result-box">
                <div class="result-item"><strong>Projet :</strong> <span id="resProjet">--</span></div>
                <div class="result-item"><strong>Client :</strong> <span id="resClient">--</span></div>
                <div class="result-item"><strong>Coefficient U :</strong> <span id="resU">--</span> W/(m²·K)</div>
                <div class="result-item"><strong>Flux thermique :</strong> <span id="resFlux">--</span> W</div>
            </div>
            <div class="btn-container">
                <button class="btn-secondary" onclick="changerEtape(2)">Modifier</button>
                <button style="background-color: #10b981;" onclick="telechargerPDFSpectaculaire()">Télécharger PDF</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-secondary" style="background-color: #ef4444; padding: 8px; font-size: 13px;" onclick="effacerDonnees()">Recommencer une autre étude</button>
            </div>
        </div>
    </div>

    <script>
        function changerEtape(numero) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step-indicator span').forEach(el => el.classList.remove('active'));
            
            document.getElementById('step-' + numero).classList.add('active');
            document.getElementById('ind-' + numero).classList.add('active');
        }

        function lancerCalcul() {
            const nomProjet = document.getElementById("nomProjet").value || "Projet Sans Nom";
            const nomClient = document.getElementById("nomClient").value || "Client Inconnu";
            const surface = parseFloat(document.getElementById("surface").value) || 0;
            const deltaT = parseFloat(document.getElementById("deltaT").value) || 0;
            const resistance = parseFloat(document.getElementById("resistance").value) || 1;

            const flux = (surface * deltaT) / resistance;
            const u = 1 / resistance;

            document.getElementById("resProjet").innerText = nomProjet;
            document.getElementById("resClient").innerText = nomClient;
            document.getElementById("resU").innerText = u.toFixed(2);
            document.getElementById("resFlux").innerText = flux.toFixed(2);

            changerEtape(3);
        }

        function telechargerPDFSpectaculaire() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // En-tête du PDF
            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 36, "F");

            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("OMBENA THERMOCALC PRO", 15, 23);

            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("Rapport d'Étude Thermique & Efficacité", 15, 30);

            // Contenu
            doc.setTextColor(30, 41, 59);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.text("Synthèse des Résultats de l'Étude", 15, 50);
            doc.line(15, 54, 195, 54);

            const projet = document.getElementById("nomProjet").value || "Non renseigné";
            const client = document.getElementById("nomClient").value || "Non renseigné";
            const u = document.getElementById("resU").innerText;
            const flux = document.getElementById("resFlux").innerText;

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.text("Nom du Projet : " + projet, 15, 66);
            doc.text("Maître d'Ouvrage : " + client, 15, 74);
            doc.text("Coefficient U (Transmission) : " + u + " W/(m²·K)", 15, 82);
            doc.text("Flux Thermique Total : " + flux + " W", 15, 90);

            // Téléchargement propre par Blob (évite les erreurs Termux/Android)
            const blobPdf = doc.output('blob');
            const urlBlob = URL.createObjectURL(blobPdf);
            const lien = document.createElement('a');
            lien.href = urlBlob;
            lien.download = 'Rapport_Thermique.pdf';
            lien.style.display = 'none';
            document.body.appendChild(lien);
            lien.click();
            
            setTimeout(() => {
                document.body.removeChild(lien);
                window.URL.revokeObjectURL(urlBlob);
            }, 100);
        }

        function effacerDonnees() {
            document.getElementById("nomProjet").value = "";
            document.getElementById("nomClient").value = "";
            document.getElementById("surface").value = "";
            document.getElementById("deltaT").value = "";
            document.getElementById("resistance").value = "";
            changerEtape(1);
        }
    </script>
</body>
</html>
