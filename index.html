<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombena ThermoCalc Pro</title>
    <!-- Importation de jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #06b6d4;
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            color: var(--text-main);
        }
        .container {
            width: 100%;
            flex: 1;
            background: var(--card-bg);
            padding: 20px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            margin-top: 15px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }
        .header-app {
            padding: 15px 16px 5px 16px;
            text-align: center;
            background: var(--bg-color);
        }
        h2 {
            color: #ffffff;
            margin: 0 0 4px 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: 500;
        }
        /* Stepper plein écran */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .step-indicator {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            text-align: center;
            flex: 1;
        }
        .step-indicator.active {
            color: var(--primary);
            transform: scale(1.05);
        }
        .step-indicator.completed {
            color: #10b981;
        }
        .step-content {
            display: none;
            flex: 1;
            flex-direction: column;
        }
        .step-content.active {
            display: flex;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8fafc;
        }
        input:focus {
            border-color: var(--primary);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 20px;
            padding-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }
        .btn-secondary {
            background: #64748b;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .btn-pdf {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-pdf:hover {
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-top: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        .result-card {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1px solid #bbf7d0;
            border-left: 6px solid #10b981;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .result-card h4 {
            margin-top: 0;
            color: #065f46;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .result-card p {
            margin: 6px 0;
            font-size: 14px;
            color: #166534;
        }
    </style>
</head>
<body>

<div class="header-app">
    <h2>Ombena ThermoCalc Pro</h2>
    <div class="subtitle">Logiciel d'Ingénierie & Performance Énergétique</div>
</div>

<div class="container">
    <!-- Indicateur d'étapes -->
    <div class="stepper">
        <div class="step-indicator active" id="ind-1">1. Projet</div>
        <div class="step-indicator" id="ind-2">2. Paramètre</div>
        <div class="step-indicator" id="ind-3">3. Résultats</div>
    </div>

    <!-- ÉTAPE 1 -->
    <div class="step-content active" id="step-1">
        <h3 style="color: #334155; font-size: 16px; margin-top: 0;">Informations Générales</h3>
        <div class="form-group">
            <label for="nomProjet">Nom du Projet / Bâtiment</label>
            <input type="text" id="nomProjet" placeholder="Ex: Résidence Lumumba - Libreville">
        </div>
        <div class="form-group">
            <label for="nomClient">Nom du Maître d'Ouvrage / Client</label>
            <input type="text" id="nomClient" placeholder="Ex: M. Ombena">
        </div>
        <div class="btn-container">
            <button onclick="allerEtape(2)">Continuer</button>
        </div>
    </div>

    <!-- ÉTAPE 2 -->
    <div class="step-content" id="step-2">
        <h3 style="color: #334155; font-size: 16px; margin-top: 0;">Caractéristiques de la Paroi</h3>
        <div class="form-group">
            <label for="surface">Surface de la paroi (m²)</label>
            <input type="number" id="surface" placeholder="Ex: 150">
        </div>
        <div class="form-group">
            <label for="deltaT">Écart de température (ΔT en °C)</label>
            <input type="number" id="deltaT" placeholder="Ex: 20">
        </div>
        <div class="form-group">
            <label for="resistance">Résistance thermique (R en m²·K/W)</label>
            <input type="number" step="0.01" id="resistance" placeholder="Ex: 2.5">
        </div>
        <div class="btn-container">
            <button class="btn-secondary" onclick="allerEtape(1)">Retour</button>
            <button onclick="lancerCalculEtEtape3()">Lancer l'Étude</button>
        </div>
    </div>

    <!-- ÉTAPE 3 -->
    <div class="step-content" id="step-3">
        <h3 style="color: #334155; font-size: 16px; margin-top: 0;">Synthèse de l'Étude</h3>
        
        <div class="result-card">
            <h4>Résultats Analytiques</h4>
            <p id="resProjet"><strong>Projet :</strong> -</p>
            <p id="resClient"><strong>Client :</strong> -</p>
            <p id="resU"><strong>Coefficient U :</strong> -</p>
            <p id="resFlux"><strong>Flux thermique total :</strong> -</p>
        </div>

        <div class="btn-container" style="margin-bottom: 0;">
            <button class="btn-secondary" onclick="allerEtape(2)">Modifier</button>
            <button class="btn-pdf" onclick="telechargerPDFSpectaculaire()">Télécharger PDF</button>
        </div>
        <button class="btn-danger" onclick="effacerDonnees()">Effacer et Recommencer</button>
    </div>
</div>

<script>
    let donneesEtude = {};

    window.onload = function() {
        if(localStorage.getItem("nomProjet")) document.getElementById("nomProjet").value = localStorage.getItem("nomProjet");
        if(localStorage.getItem("nomClient")) document.getElementById("nomClient").value = localStorage.getItem("nomClient");
        if(localStorage.getItem("surface")) document.getElementById("surface").value = localStorage.getItem("surface");
        if(localStorage.getItem("deltaT")) document.getElementById("deltaT").value = localStorage.getItem("deltaT");
        if(localStorage.getItem("resistance")) document.getElementById("resistance").value = localStorage.getItem("resistance");
    };

    function allerEtape(num) {
        if(num === 2) {
            const nom = document.getElementById("nomProjet").value;
            if(!nom.trim()) {
                alert("Veuillez renseigner le nom du projet.");
                return;
            }
        }
        
        document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${num}`).classList.add('active');

        for(let i=1; i<=3; i++) {
            const ind = document.getElementById(`ind-${i}`);
            ind.classList.remove('active', 'completed');
            if(i < num) ind.classList.add('completed');
            else if(i === num) ind.classList.add('active');
        }
        window.scrollTo(0,0);
    }

    function lancerCalculEtEtape3() {
        const nomProjet = document.getElementById("nomProjet").value || "Projet Standard";
        const nomClient = document.getElementById("nomClient").value || "Non spécifié";
        const surface = parseFloat(document.getElementById("surface").value);
        const deltaT = parseFloat(document.getElementById("deltaT").value);
        const R = parseFloat(document.getElementById("resistance").value);

        if (!surface || !deltaT || !R || R <= 0) {
            alert("Veuillez remplir correctement tous les champs numériques (R doit être > 0).");
            return;
        }

        localStorage.setItem("nomProjet", nomProjet);
        localStorage.setItem("nomClient", nomClient);
        localStorage.setItem("surface", surface);
        localStorage.setItem("deltaT", deltaT);
        localStorage.setItem("resistance", R);

        const fluxThermique = (surface * deltaT) / R;
        const coefficientU = 1 / R;

        donneesEtude = { nomProjet, nomClient, surface, deltaT, R, fluxThermique, coefficientU };

        document.getElementById("resProjet").innerHTML = `<strong>Projet :</strong> ${nomProjet}`;
        document.getElementById("resClient").innerHTML = `<strong>Client :</strong> ${nomClient}`;
        document.getElementById("resU").innerHTML = `<strong>Coefficient U :</strong> ${coefficientU.toFixed(2)} W/(m²·K)`;
        document.getElementById("resFlux").innerHTML = `<strong>Flux thermique total :</strong> ${fluxThermique.toFixed(2)} W`;

        allerEtape(3);
    }

    function telechargerPDFSpectaculaire() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, 210, 36, "F");

        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("OMBENA THERMOCALC PRO", 15, 23);

        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.text("Rapport d'Étude Thermique & Efficacité", 130, 23);

        doc.setTextColor(30, 41, 59);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text("1. Informations Générales du Projet", 15, 52);
        
        doc.setDrawColor(200, 200, 200);
        doc.line(15, 56, 195, 56);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.text("Nom du Projet :", 15, 66);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.nomProjet, 55, 66);

        doc.setFont("helvetica", "normal");
        doc.text("Maître d'Ouvrage :", 15, 74);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.nomClient, 55, 74);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text("2. Paramètres Thermiques de la Paroi", 15, 94);
        doc.line(15, 98, 195, 98);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.text("- Surface de la paroi :", 20, 108);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.surface + " m²", 85, 108);

        doc.setFont("helvetica", "normal");
        doc.text("- Écart de température (ΔT) :", 20, 116);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.deltaT + " °C", 85, 116);

        doc.setFont("helvetica", "normal");
        doc.text("- Résistance thermique (R) :", 20, 124);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.R + " m²·K/W", 85, 124);

        doc.setFillColor(240, 253, 244);
        doc.setDrawColor(16, 185, 129);
        doc.roundedRect(15, 138, 180, 42, 3, 3, "FD");

        doc.setTextColor(5, 150, 105);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text("3. Synthèse des Résultats de l'Étude", 22, 150);

        doc.setTextColor(30, 41, 59);
        doc.setFontSize(11);
        doc.text("Coefficient U (Transmission) :", 22, 162);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.coefficientU.toFixed(2) + " W/(m²·K)", 115, 162);

        doc.setFont("helvetica", "normal");
        doc.text("Flux Thermique Total :", 22, 172);
        doc.setFont("helvetica", "bold");
        doc.text(donneesEtude.fluxThermique.toFixed(2) + " W", 115, 172);

        doc.setFont("helvetica", "italic");
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text("Document généré officiellement par Ombena ThermoCalc Pro - Conçu par Ombena", 15, 285);

        doc.output('dataurlnewwindow');
        doc.save(`Rapport_Thermique_${donneesEtude.nomProjet.replace(/\s+/g, '_')}.pdf`);
    }

    function effacerDonnees() {
        localStorage.clear();
        document.getElementById("nomProjet").value = "";
        document.getElementById("nomClient").value = "";
        document.getElementById("surface").value = "";
        document.getElementById("deltaT").value = "";
        document.getElementById("resistance").value = "";
        allerEtape(1);
        alert("Données réinitialisées !");
    }
</script>

</body>
</html>
