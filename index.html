<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombena ThermoCalc Pro</title>
    <!-- Importation de la bibliothèque jsPDF pour générer le PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #004080;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #004080;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #002b5c;
        }
        .btn-reset {
            background-color: #d9534f;
        }
        .btn-reset:hover {
            background-color: #c9302c;
        }
        .btn-pdf {
            background-color: #28a745;
        }
        .btn-pdf:hover {
            background-color: #218838;
        }
        #resultat {
            margin-top: 20px;
            padding: 15px;
            background: #e9f0fa;
            border-left: 5px solid #004080;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ombena ThermoCalc Pro</h2>
    <p style="text-align: center; font-size: 14px; color: #666;">Ingénierie Thermique & Efficacité Énergétique</p>
    
    <div class="form-group">
        <label for="nomProjet">Nom du Projet :</label>
        <input type="text" id="nomProjet" placeholder="Ex: Résidence Lumumba">
    </div>

    <div class="form-group">
        <label for="surface">Surface de la paroi (m²) :</label>
        <input type="number" id="surface" placeholder="Ex: 150">
    </div>

    <div class="form-group">
        <label for="deltaT">Écart de température (ΔT en °C) :</label>
        <input type="number" id="deltaT" placeholder="Ex: 20">
    </div>

    <div class="form-group">
        <label for="resistance">Résistance thermique (R en m²·K/W) :</label>
        <input type="number" step="0.01" id="resistance" placeholder="Ex: 2.5">
    </div>

    <button onclick="lancerCalcul()">Lancer l'Étude Thermique</button>
    <button class="btn-reset" onclick="effacerDonnees()">Effacer les données</button>

    <div id="resultat">
        <h3>Résultats de l'Étude</h3>
        <p id="texteResultat"></p>
        <button class="btn-pdf" onclick="telechargerPDF()">Télécharger le rapport PDF</button>
    </div>
</div>

<script>
    window.onload = function() {
        if(localStorage.getItem("nomProjet")) document.getElementById("nomProjet").value = localStorage.getItem("nomProjet");
        if(localStorage.getItem("surface")) document.getElementById("surface").value = localStorage.getItem("surface");
        if(localStorage.getItem("deltaT")) document.getElementById("deltaT").value = localStorage.getItem("deltaT");
        if(localStorage.getItem("resistance")) document.getElementById("resistance").value = localStorage.getItem("resistance");
    };

    let dernierCalcul = {};

    function lancerCalcul() {
        const nom = document.getElementById("nomProjet").value || "Projet sans nom";
        const surface = parseFloat(document.getElementById("surface").value);
        const deltaT = parseFloat(document.getElementById("deltaT").value);
        const R = parseFloat(document.getElementById("resistance").value);

        if (!surface || !deltaT || !R || R <= 0) {
            alert("Veuillez remplir correctement tous les champs numériques (R doit être > 0).");
            return;
        }

        localStorage.setItem("nomProjet", nom);
        localStorage.setItem("surface", surface);
        localStorage.setItem("deltaT", deltaT);
        localStorage.setItem("resistance", R);

        const fluxThermique = (surface * deltaT) / R;
        const coefficientU = 1 / R;

        // Stocker pour le PDF
        dernierCalcul = { nom, surface, deltaT, R, fluxThermique, coefficientU };

        const resDiv = document.getElementById("resultat");
        const texteRes = document.getElementById("texteResultat");

        texteRes.innerHTML = `
            <strong>Projet :</strong> ${nom}<br>
            <strong>Coefficient de transmission thermique (U) :</strong> ${coefficientU.toFixed(2)} W/(m²·K)<br>
            <strong>Flux thermique total estimé :</strong> ${fluxThermique.toFixed(2)} W
        `;
        resDiv.style.display = "block";
    }

    function telechargerPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.setTextColor(0, 64, 128);
        doc.text("Ombena ThermoCalc Pro", 20, 20);

        doc.setFontSize(12);
        doc.setTextColor(100, 100, 100);
        doc.text("Rapport d'Étude Thermique & Efficacité Énergétique", 20, 28);

        doc.setLineWidth(0.5);
        doc.line(20, 34, 190, 34);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.setTextColor(50, 50, 50);

        let y = 48;
        doc.text(`Nom du Projet : ${dernierCalcul.nom}`, 20, y);
        y += 10;
        doc.text(`Surface de la paroi : ${dernierCalcul.surface} m²`, 20, y);
        y += 10;
        doc.text(`Ecart de temperature (Delta T) : ${dernierCalcul.deltaT} °C`, 20, y);
        y += 10;
        doc.text(`Resistance thermique (R) : ${dernierCalcul.R} m²·K/W`, 20, y);

        y += 16;
        doc.setFont("helvetica", "bold");
        doc.text("Resultats de l'etude :", 20, y);
        
        y += 10;
        doc.setFont("helvetica", "normal");
        doc.text(`- Coefficient U : ${dernierCalcul.coefficientU.toFixed(2)} W/(m²·K)`, 25, y);
        y += 10;
        doc.text(`- Flux thermique total : ${dernierCalcul.fluxThermique.toFixed(2)} W`, 25, y);

        y += 25;
        doc.setFontSize(9);
        doc.setTextColor(150, 150, 150);
        doc.text("Genere par Ombena ThermoCalc Pro - Concu par Ombena", 20, y);

        doc.save(`Rapport_Thermique_${dernierCalcul.nom.replace(/\s+/g, '_')}.pdf`);
    }

    function effacerDonnees() {
        localStorage.clear();
        document.getElementById("nomProjet").value = "";
        document.getElementById("surface").value = "";
        document.getElementById("deltaT").value = "";
        document.getElementById("resistance").value = "";
        document.getElementById("resultat").style.display = "none";
        alert("Données effacées !");
    }
</script>

</body>
</html>
